<div class="min-h-screen overflow-x-clip bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <!-- Phones: logo + account on the first row, the workspace switcher on its own full-width row. -->
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-3 px-4 py-3 sm:px-6 sm:py-4">
      <a routerLink="/" class="shrink-0"><h1 class="text-xl font-bold tracking-tight text-slate-900">DocQuery</h1></a>
      @if (auth.isAuthenticated()) {
        <app-workspace-switcher class="order-last w-full min-w-0 sm:order-none sm:w-auto sm:flex-1" />
        <div class="ml-auto flex min-w-0 items-center gap-3 text-sm sm:ml-0">
          <span class="hidden max-w-48 truncate text-slate-600 sm:inline" data-testid="user-name">{{ auth.displayName() }}</span>
          <button
            type="button"
            data-testid="sign-out"
            class="shrink-0 rounded-md border border-slate-300 px-3 py-1.5 text-slate-700 hover:bg-slate-50"
            [title]="'Signed in as ' + auth.displayName()"
            (click)="signOut()"
          >
            Sign out
          </button>
        </div>
      } @else {
        <span class="ml-auto text-sm text-slate-500">AI document intelligence</span>
      }
    </div>
  </header>
  <main class="px-4 py-6 sm:px-6 sm:py-10">
    <router-outlet />
  </main>
</div>
