<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 py-4">
      <div class="flex items-center gap-6">
        <a routerLink="/"><h1 class="text-xl font-bold tracking-tight text-slate-900">DocQuery</h1></a>
        @if (auth.isAuthenticated()) {
          <app-workspace-switcher />
        }
      </div>
      @if (auth.isAuthenticated()) {
        <div class="flex items-center gap-3 text-sm">
          <span class="text-slate-600" data-testid="user-name">{{ auth.displayName() }}</span>
          <button
            type="button"
            data-testid="sign-out"
            class="rounded-md border border-slate-300 px-3 py-1.5 text-slate-700 hover:bg-slate-50"
            (click)="signOut()"
          >
            Sign out
          </button>
        </div>
      } @else {
        <span class="text-sm text-slate-500">AI document intelligence</span>
      }
    </div>
  </header>
  <main class="px-6 py-10">
    <router-outlet />
  </main>
</div>
