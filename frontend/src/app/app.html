<div class="min-h-screen overflow-x-clip bg-slate-50">
  <a
    href="#main"
    class="sr-only z-50 rounded-md bg-white px-3 py-2 text-sm font-medium text-indigo-700 shadow focus:not-sr-only focus:fixed focus:left-3 focus:top-3"
    >Skip to content</a
  >

  <!-- Top bar -->
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="flex h-14 items-center gap-2 px-3 sm:gap-3 sm:px-6">
      @if (auth.isAuthenticated()) {
        <button
          #menuButton
          type="button"
          class="-ml-1 rounded-md p-2 text-slate-600 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 xl:hidden"
          aria-controls="mobile-nav"
          [attr.aria-expanded]="menuOpen()"
          aria-label="Open navigation"
          data-testid="menu-button"
          (click)="openMenu()"
        >
          <app-icon name="menu" class="size-6" />
        </button>
      }
      <a
        routerLink="/"
        class="flex shrink-0 items-center gap-2 rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        aria-label="DocQuery home"
      >
        <!-- Decorative letters drawn by CSS, so they are not part of the link's accessible name (WCAG 2.5.3). -->
        <span
          class="flex size-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white before:content-[attr(data-letters)]"
          data-letters="DQ"
          aria-hidden="true"
        ></span>
        <h1 class="text-lg font-bold tracking-tight text-slate-900">DocQuery</h1>
      </a>
      @if (auth.isAuthenticated()) {
        <div class="ml-4 hidden min-w-0 flex-1 border-l border-slate-200 pl-4 md:block">
          <app-workspace-switcher />
        </div>
        <div class="ml-auto shrink-0">
          <app-user-menu />
        </div>
      } @else {
        <span class="ml-auto text-sm text-slate-500">AI document intelligence</span>
      }
    </div>
  </header>

  @if (auth.isAuthenticated()) {
    <div class="flex">
      <!-- Desktop sidebar -->
      <aside
        class="sticky top-14 hidden h-[calc(100vh-3.5rem)] w-64 shrink-0 overflow-y-auto border-r border-slate-200 bg-white px-3 py-6 xl:block"
        data-testid="sidebar"
      >
        <app-nav />
      </aside>
      <main
        id="main"
        tabindex="-1"
        class="min-w-0 flex-1 px-4 py-6 focus:outline-none sm:px-6 sm:py-8"
      >
        <router-outlet />
      </main>
    </div>

    <!-- Mobile and tablet navigation -->
    @if (menuOpen()) {
      <div class="fixed inset-0 z-40 xl:hidden" data-testid="mobile-nav-overlay">
        <button
          type="button"
          class="absolute inset-0 h-full w-full cursor-default bg-slate-900/40"
          tabindex="-1"
          aria-hidden="true"
          (click)="closeMenu()"
        ></button>
        <div
          #drawer
          id="mobile-nav"
          role="dialog"
          aria-modal="true"
          aria-label="Navigation"
          class="absolute inset-y-0 left-0 flex w-72 max-w-[85vw] flex-col overflow-y-auto bg-white shadow-xl"
          data-testid="mobile-nav"
          (keydown)="onDrawerKeydown($event)"
        >
          <div
            class="flex h-14 shrink-0 items-center justify-between border-b border-slate-200 px-4"
          >
            <span class="text-lg font-bold tracking-tight text-slate-900">DocQuery</span>
            <button
              #closeButton
              type="button"
              class="rounded-md p-2 text-slate-600 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
              aria-label="Close navigation"
              data-testid="menu-close"
              (click)="closeMenu()"
            >
              <app-icon name="close" class="size-5" />
            </button>
          </div>
          <div class="border-b border-slate-200 px-4 py-3 md:hidden">
            <app-workspace-switcher />
          </div>
          <div class="px-3 py-5">
            <app-nav (navigate)="closeMenu()" />
          </div>
        </div>
      </div>
    }
  } @else {
    <main id="main" tabindex="-1" class="px-4 py-6 focus:outline-none sm:px-6 sm:py-10">
      <router-outlet />
    </main>
  }
</div>
