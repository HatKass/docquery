# All values can be overridden with environment variables; defaults target the
# local Docker Compose stack (see /compose.yaml and /.env.example).
spring:
  application:
    name: api-service
  config:
    # When run from source (./mvnw spring-boot:run in api-service/), read the repo-root .env
    # that Docker Compose also reads, so both agree on POSTGRES_PORT, credentials, etc.
    # Optional: absent in containers and CI. Real environment variables still take precedence.
    # DOCQUERY_ENV_FILE points elsewhere (tests set it to a non-existent file to stay hermetic).
    import: optional:file:${DOCQUERY_ENV_FILE:../.env}[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_URL wins if set (containers use it); otherwise built from the same POSTGRES_* variables
    # compose.yaml uses for the published host port and credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:docquery}}
    username: ${DB_USERNAME:${POSTGRES_USER:docquery}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:docquery_local}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    # classpath:db/demo (demo seed) is appended when docquery.demo.seed-enabled=true.
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Must allow docquery.documents.max-file-size; the request limit adds room for multipart headers.
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:26MB}
      # Spool uploads to disk (never hold whole files in memory).
      file-size-threshold: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          # The "iss" claim every token must carry: the URL the *browser* uses for Keycloak.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/docquery}
          # Where the API fetches signing keys. Differs from the issuer when the API runs in a
          # container (http://keycloak:8080/...). Setting it also avoids OIDC discovery at startup.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/docquery/protocol/openid-connect/certs}
          # Tokens must be minted for this API (audience mapper in the realm).
          audiences: ${OIDC_AUDIENCE:docquery-api}

server:
  port: ${API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Detailed component status is useful locally; set to "never" or
      # "when-authorized" in production.
      show-details: ${HEALTH_SHOW_DETAILS:always}
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

docquery:
  demo:
    # Seeds the demo users' memberships and "Demo workspace" (db/demo). Set
    # DEMO_SEED_ENABLED=false in production.
    seed-enabled: ${DEMO_SEED_ENABLED:true}
  documents:
    # Largest accepted upload. Raise DOCUMENT_MAX_REQUEST_SIZE along with it.
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:25MB}
    # Live status streams end after this long; the browser reconnects with a fresh token.
    event-stream-timeout: ${DOCUMENT_EVENT_STREAM_TIMEOUT:15m}
    event-stream-heartbeat: 20s
  storage:
    s3:
      # Any S3-compatible store. Leave S3_ENDPOINT empty for AWS S3, and S3_ACCESS_KEY empty to use
      # the AWS default credentials chain (IAM role, AWS_* variables...).
      endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:docquery}
      secret-key: ${S3_SECRET_KEY:docquery_local_secret}
      bucket: ${S3_BUCKET:docquery-documents}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      # Convenience for local runs; production buckets are created by infrastructure code.
      create-bucket: ${S3_CREATE_BUCKET:false}
  security:
    # Origins allowed to call the API directly from a browser. The Angular dev server
    # proxies /api, so this only matters when the SPA is served from another origin.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

info:
  app:
    name: DocQuery API
    description: Auth, workspaces, documents, search and RAG chat
