# All values can be overridden with environment variables; defaults target the
# local Docker Compose stack (see /compose.yaml and /.env.example).
spring:
  application:
    name: api-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docquery}
    username: ${DB_USERNAME:docquery}
    password: ${DB_PASSWORD:docquery_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Detailed component status is useful locally; set to "never" or
      # "when-authorized" in production.
      show-details: ${HEALTH_SHOW_DETAILS:always}
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

info:
  app:
    name: DocQuery API
    description: Auth, workspaces, documents, search and RAG chat
