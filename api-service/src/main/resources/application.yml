# All values can be overridden with environment variables; defaults target the
# local Docker Compose stack (see /compose.yaml and /.env.example).
spring:
  application:
    name: api-service
  config:
    # When run from source (./mvnw spring-boot:run in api-service/), read the repo-root .env
    # that Docker Compose also reads, so both agree on POSTGRES_PORT, credentials, etc.
    # Optional: absent in containers and CI. Real environment variables still take precedence.
    # DOCQUERY_ENV_FILE points elsewhere (tests set it to a non-existent file to stay hermetic).
    import: optional:file:${DOCQUERY_ENV_FILE:../.env}[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    # DB_URL wins if set (containers use it); otherwise built from the same POSTGRES_* variables
    # compose.yaml uses for the published host port and credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:docquery}}
    username: ${DB_USERNAME:${POSTGRES_USER:docquery}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:docquery_local}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    # classpath:db/demo (demo seed) is appended when docquery.demo.seed-enabled=true.
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Must allow docquery.documents.max-file-size; the request limit adds room for multipart headers.
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:26MB}
      # Spool uploads to disk (never hold whole files in memory).
      file-size-threshold: 0
  kafka:
    # Same broker as the ingestion worker. Containers use kafka:29092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    consumer:
      # One group for all replicas: each status event is applied to the database exactly once.
      group-id: api-service
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        # Fail fast when Kafka is down; the outbox relay simply retries on its next run.
        max.block.ms: 10000
    listener:
      ack-mode: record
  # --- Chat and query embeddings (Spring AI). The providers are configuration, not code. -----
  ai:
    model:
      # ollama (local, default) | openai | anthropic. Exactly one chat model is created.
      chat: ${CHAT_PROVIDER:ollama}
      # Must be the provider and model the ingestion worker embeds chunks with (ollama | openai).
      embedding: ${EMBEDDING_PROVIDER:ollama}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      # Native Ollama on the host. From a container: http://host.docker.internal:11434
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        # llama3.2:3b fits a 4 GB GPU; larger models (qwen2.5:7b, llama3.1:8b) cite more reliably.
        model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
        # Low temperature: answers should restate the sources, not be creative.
        temperature: ${CHAT_TEMPERATURE:0.1}
        # Context window: 5 sources (~1,500 tokens) + rules + recent history fit; 4096 keeps llama3.2:3b fully on a 4 GB GPU.
        num-ctx: ${OLLAMA_CHAT_NUM_CTX:4096}
        num-predict: ${CHAT_MAX_TOKENS:1024}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        # Models are pulled by you (ollama pull ...), never silently at startup.
        pull-model-strategy: never
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        temperature: ${CHAT_TEMPERATURE:0.1}
        max-tokens: ${CHAT_MAX_TOKENS:1024}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:768}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-5-5}
        temperature: ${CHAT_TEMPERATURE:0.1}
        max-tokens: ${CHAT_MAX_TOKENS:1024}
    retry:
      # A user is waiting: retry briefly, then report the outage instead of hanging.
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 3s
  http:
    clients:
      imperative:
        # Plain HTTP/1.1 (HttpURLConnection), as in the worker: the JDK HttpClient's h2c upgrade
        # attempt on plain-HTTP POSTs can stall requests to Ollama.
        factory: simple
      connect-timeout: 5s
      # Generous: Ollama loads a model into memory on its first request.
      read-timeout: ${CHAT_READ_TIMEOUT:120s}
  security:
    oauth2:
      resourceserver:
        jwt:
          # The "iss" claim every token must carry: the URL the *browser* uses for Keycloak.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/docquery}
          # Where the API fetches signing keys. Differs from the issuer when the API runs in a
          # container (http://keycloak:8080/...). Setting it also avoids OIDC discovery at startup.
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/docquery/protocol/openid-connect/certs}
          # Tokens must be minted for this API (audience mapper in the realm).
          audiences: ${OIDC_AUDIENCE:docquery-api}

server:
  port: ${API_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Detailed component status is useful locally; set to "never" or
      # "when-authorized" in production.
      show-details: ${HEALTH_SHOW_DETAILS:always}
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: true

docquery:
  demo:
    # Seeds the demo users' memberships and "Demo workspace" (db/demo). Set
    # DEMO_SEED_ENABLED=false in production.
    seed-enabled: ${DEMO_SEED_ENABLED:true}
  documents:
    # Largest accepted upload. Raise DOCUMENT_MAX_REQUEST_SIZE along with it.
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:25MB}
    # Live status streams end after this long; the browser reconnects with a fresh token.
    event-stream-timeout: ${DOCUMENT_EVENT_STREAM_TIMEOUT:15m}
    event-stream-heartbeat: 20s
    # A document still queued (UPLOADED) after this long can be retried by a member.
    requeue-after: ${DOCUMENT_REQUEUE_AFTER:10m}
  storage:
    s3:
      # Any S3-compatible store. Leave S3_ENDPOINT empty for AWS S3, and S3_ACCESS_KEY empty to use
      # the AWS default credentials chain (IAM role, AWS_* variables...).
      endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:docquery}
      secret-key: ${S3_SECRET_KEY:docquery_local_secret}
      bucket: ${S3_BUCKET:docquery-documents}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      # Convenience for local runs; production buckets are created by infrastructure code.
      create-bucket: ${S3_CREATE_BUCKET:false}
  ingestion:
    topics:
      # Must match the ingestion worker.
      uploaded: document.uploaded
      status: document.status
      dead-letter: document.uploaded.dlt
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      replicas: ${KAFKA_TOPIC_REPLICAS:1}
    outbox:
      poll-interval: ${OUTBOX_POLL_INTERVAL:500ms}
      batch-size: 50
      send-timeout: 10s
  retrieval:
    # Resolves to the model of the selected embedding provider; must match the ingestion worker.
    embedding-model: ${spring.ai.${spring.ai.model.embedding}.embedding.model}
    # nomic-embed-text expects this task prefix for queries; set EMBEDDING_QUERY_PREFIX= (empty) for other models.
    query-prefix: "${EMBEDDING_QUERY_PREFIX:search_query: }"
    vector-candidates: 20
    keyword-candidates: 20
    max-sources: ${RETRIEVAL_MAX_SOURCES:5}
    # Vector matches below this cosine similarity are treated as unrelated (nomic-embed-text: related ≈ 0.7, unrelated ≈ 0.5).
    min-similarity: ${RETRIEVAL_MIN_SIMILARITY:0.6}
    rrf-k: 60
    # A question about one document (most sources from it: summaries, assessments) gets up to this
    # many more of that document's passages. 0 disables it.
    focus-extra-chunks: ${RETRIEVAL_FOCUS_EXTRA_CHUNKS:4}
    focus-min-share: 0.6
    # Total source text per answer (~4 characters per token): with rules, history and the answer it
    # stays inside OLLAMA_CHAT_NUM_CTX=4096. Raise both together for larger models.
    max-context-characters: ${RETRIEVAL_MAX_CONTEXT_CHARACTERS:8000}
  chat:
    # Recorded with every answer.
    model: ${spring.ai.${spring.ai.model.chat}.chat.model}
    history-messages: ${CHAT_HISTORY_MESSAGES:6}
    max-question-length: 2000
    stream-timeout: ${CHAT_STREAM_TIMEOUT:5m}
  usage:
    # Cost safety for a public demo. Every limit: 0 = no limit. Daily quotas count per UTC day.
    quotas:
      # Workspaces a user may create (and that still exist). Admins can override it per user.
      max-workspaces-per-user: ${QUOTA_MAX_WORKSPACES_PER_USER:3}
      daily-questions-per-user: ${QUOTA_DAILY_QUESTIONS_PER_USER:50}
      daily-uploads-per-user: ${QUOTA_DAILY_UPLOADS_PER_USER:20}
      max-documents-per-workspace: ${QUOTA_MAX_DOCUMENTS_PER_WORKSPACE:100}
    # USD per 1M tokens, "model=input/output;...". Used for cost ESTIMATES only; verify against the
    # providers' pricing pages (values as of 2026-11). Models without a price show as "unpriced".
    prices: "${USAGE_PRICES:llama3.2:3b=0/0;qwen2.5:7b=0/0;llama3.1:8b=0/0;nomic-embed-text=0/0;gpt-4.1-mini=0.40/1.60;text-embedding-3-small=0.02/0;claude-haiku-5-5=0.10/0.50;claude-sonnet-5-5=2.00/10.00}"
  reindex:
    # One-off maintenance command, see ReindexCommand (never set in normal operation).
    run: false
  security:
    # Origins allowed to call the API directly from a browser. The Angular dev server
    # proxies /api, so this only matters when the SPA is served from another origin.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    # Keycloak realm role of platform admins (admin page: all usage, failures, dead letters, limits).
    admin-role: ${ADMIN_ROLE:docquery-admin}

info:
  app:
    name: DocQuery API
    description: Auth, workspaces, documents, search and RAG chat
