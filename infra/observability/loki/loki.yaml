# Loki (single binary, local disk): stores the services' logs, received over OTLP
# (http://loki:3100/otlp/v1/logs). service.name / service.namespace / deployment.environment become
# labels; trace_id, span_id and the other log attributes are kept as structured metadata, so
# "{service_namespace="docquery"} | trace_id="<id>"" finds every log line of one trace.
# Local development settings; a production setup uses object storage (see ADR 0014).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Required for OTLP ingestion (attributes are stored as structured metadata).
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
