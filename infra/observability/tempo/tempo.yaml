# Tempo (single binary, local disk): stores traces received over OTLP.
# Local development settings; a production setup uses object storage (see ADR 0014).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        # The services export over OTLP/HTTP (http://tempo:4318/v1/traces).
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Flush traces to blocks quickly so they are searchable soon after a request.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

# Derives RED metrics per span and the service graph (api-service → Kafka → ingestion-worker) from
# the traces, written to Prometheus. Grafana's "Service graph" tab in Explore → Tempo uses them.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
