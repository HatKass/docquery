name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-service:
    name: api-service (build + tests)
    # Pinned runner image — never ubuntu-latest — so builds are reproducible.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api-service/pom.xml
      # Testcontainers uses the runner's Docker daemon (pgvector Postgres). "verify" also runs the RAG
      # evaluation with stub models (RagEvaluationTests) and enforces the JaCoCo coverage minimum.
      - name: Build, test, evaluate and check coverage
        run: chmod +x mvnw && ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-test-reports
          path: api-service/target/surefire-reports/
      - name: Upload coverage and RAG evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-service-coverage-and-evaluation
          path: |
            api-service/target/site/jacoco/
            api-service/target/evaluation/
          if-no-files-found: ignore

  ingestion-worker:
    name: ingestion-worker (build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ingestion-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ingestion-worker/pom.xml
      # Testcontainers uses the runner's Docker daemon (Kafka in KRaft mode). Also checks that the
      # sample PDFs and the evaluation chunk fixture are up to date (EvaluationFixtureTests).
      - name: Build, test and check coverage
        run: chmod +x mvnw && ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ingestion-worker-test-reports
          path: ingestion-worker/target/surefire-reports/
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingestion-worker-coverage
          path: ingestion-worker/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend (build + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
      # The Playwright e2e suite needs the whole stack and a chat model, so it runs locally
      # (frontend/e2e/README.md); CI makes sure it still compiles.
      - run: npm run e2e:typecheck

  compose:
    name: docker compose (config + image builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file (all profiles)
        run: docker compose --profile ai --profile apps config --quiet
      - name: Build service images
        run: docker compose --profile apps build
