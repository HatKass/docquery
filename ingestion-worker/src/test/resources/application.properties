# Tests keep tracing on (@AutoConfigureTracing), so spans can be asserted with the in-memory exporter
# of TestcontainersConfiguration, but never send telemetry anywhere, not even to a local Tempo/Loki.
management.tracing.export.otlp.enabled=false
management.logging.export.otlp.enabled=false
management.opentelemetry.tracing.export.schedule-delay=100ms
