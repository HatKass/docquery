# Test-only settings, layered over src/main/resources/application.yml.
# (config/ has higher precedence than the main application.yml on the classpath.)

# No real embedding provider in tests: StubEmbeddingModel (TestcontainersConfiguration) is the only one.
# Must be a static property: auto-configuration conditions are evaluated before dynamic properties.
spring.ai.model.embedding=stub
docquery.ingestion.embedding.model=stub-embedding

# Fast retries keep failure tests short.
docquery.ingestion.retry.max-attempts=3
docquery.ingestion.retry.initial-interval=100ms
docquery.ingestion.retry.multiplier=1.5
docquery.ingestion.retry.max-interval=500ms

# Small chunks so short test documents still produce several of them.
docquery.ingestion.chunking.max-characters=300
docquery.ingestion.chunking.overlap-characters=50
